<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "fr-FR" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ site.Title }} | Boxe : analyses, équipements et actus{{ else if eq .Kind "404" }}Page introuvable | {{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    {{ partial "seo-head.html" . }}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" media="print" data-media="all">
    <script>document.querySelectorAll('link[data-media]').forEach(function(l){l.addEventListener('load',function(){l.media=l.dataset.media})});</script>

    {{ $css := resources.Get "css/main.css" }}
    {{ if $css }}{{ $css = $css | resources.Fingerprint }}<link rel="stylesheet" href="{{ $css.RelPermalink }}">{{ end }}
    {{ block "head" . }}{{ end }}
</head>
<body>
    <a href="#main-content" class="skip-to-content">Aller au contenu</a>
    {{ partial "header.html" . }}
    <main id="main-content">
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
</body>
</html>
