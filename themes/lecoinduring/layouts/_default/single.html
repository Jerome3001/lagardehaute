{{ define "main" }}
<section class="page-hero page-hero-rouge">
    <div class="wrap">
        <nav class="crumbs" aria-label="Fil d'Ariane">
            <a href="{{ "/" | relURL }}">Accueil</a><span aria-hidden="true">/</span><span aria-current="page">{{ .Title }}</span>
        </nav>
        <h1>{{ .Title }}</h1>
        <div class="page-hero-sub">
            {{ with .Description }}<p class="deck">{{ . }}</p>{{ end }}
        </div>
        {{ if and .Params.noindex (not .Lastmod.IsZero) }}<p class="page-updated">Mis à jour le {{ time.Format ":date_long" .Lastmod }}</p>{{ end }}
    </div>
</section>
<section class="listing">
    <div class="wrap"><div class="prose">{{ .Content }}</div></div>
</section>
{{ end }}
