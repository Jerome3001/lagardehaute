# Déploiement de La Garde Haute sur GitHub Pages.
# Se déclenche à chaque envoi sur la branche main, ou à la main depuis l'onglet Actions.
# Prérequis dans le dépôt : Settings > Pages > Source = « GitHub Actions ».
# L'adresse du site (baseURL) est lue dans les réglages de Pages : adresse github.io tant qu'aucun domaine n'est branché,
# puis le domaine personnalisé dès qu'il est saisi dans Settings > Pages. Rien à modifier dans ce fichier au moment du branchement.

name: Déployer La Garde Haute sur GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "IndexNow : soumettre tout le sitemap (sinon seulement les pages modifiées depuis 7 jours)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.160.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Hugo (version fixée, somme de contrôle vérifiée)
        run: |
          BASE="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          DEB="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget -q -O "${RUNNER_TEMP}/${DEB}" "${BASE}/${DEB}"
          wget -q -O "${RUNNER_TEMP}/checksums.txt" "${BASE}/hugo_${HUGO_VERSION}_checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${DEB}\$" checksums.txt | sha256sum -c -
          sudo dpkg -i "${DEB}"

      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Construire le site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Contrôler la sortie
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/5ce091fa9025da76abc6d669c046b0b5.txt
          test "$(cat public/5ce091fa9025da76abc6d669c046b0b5.txt)" = "5ce091fa9025da76abc6d669c046b0b5"
          test -f public/llms.txt
          test -f public/images/og-default.png
          ! grep -rl "localhost" public || { echo "Une adresse localhost est restée dans le site"; exit 1; }
          ! grep -rlE "\[à renseigner|à renseigner avant" public || { echo "Un repère à renseigner est resté dans une page"; exit 1; }

      - name: Envoyer l'artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Prévient Bing, Yandex, Naver, Seznam et Yep des pages nouvelles ou modifiées.
  # Google ne gère pas IndexNow : il continue de passer par le sitemap.
  # La clé n'est pas un secret : elle est publiée dans 5ce091fa9025da76abc6d669c046b0b5.txt à la racine du site.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Notifier IndexNow
        continue-on-error: true
        env:
          SITE_URL: "https://lagardehaute.fr/"
          INDEXNOW_KEY: "5ce091fa9025da76abc6d669c046b0b5"
          INDEXNOW_MODE: ${{ inputs.indexnow_all && 'all' || 'recent' }}
        run: python3 .github/scripts/indexnow.py
